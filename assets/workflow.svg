<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="workflow-title workflow-desc" id="workflow-root">
<title id="workflow-title">From a video link to an evidence-backed digest</title>
<desc id="workflow-desc">A Python helper tries public captions, yt-dlp, and optional local transcription in order, then provides normalized timestamped text for an AI agent to summarize, or reports an actionable failure.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #workflow-root { color: #202124; font-family: Arial,sans-serif; }
      #workflow-root text { font-family:Arial,sans-serif;fill:#202124 }
      #workflow-root .name { font-size:16px;font-weight:600 }
      #workflow-root .sub { font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;fill:#62656b }
      #workflow-root .tag { font-size:12px;letter-spacing:1px;fill:#62656b }
      #workflow-root .title { font-family:Georgia,serif;font-size:40px }
      #workflow-root .node { fill:#fff;stroke:#62656b;stroke-width:1 }
      #workflow-root .focal { fill:#fff1f4;stroke:#e11d48;stroke-width:1.2 }
      #workflow-root .edge { fill:none;stroke:#62656b;stroke-width:1.4;marker-end:url(#workflow-workflow-arrow) }
      #workflow-root .optional { stroke-dasharray:5 4 }
      #workflow-root .note { font-size:16px;fill:#62656b }</style><marker id="workflow-workflow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#62656b"/></marker></defs>
<rect width="1280" height="720" fill="#f7f7f5"/>
<text x="64" y="64" class="tag">YOUTUBE / BILIBILI DIGEST · WORKFLOW</text>
<text x="64" y="116" class="title">Get the text. Keep the evidence.</text>
<text x="64" y="152" class="note">The helper retrieves a transcript. Your AI agent turns it into understanding.</text>
<!-- Acquisition subsystem: the three methods are attempted in order. -->
<rect x="296" y="184" width="312" height="400" rx="8" fill="#eeeeeb" stroke="#d7d7d3"/>
<text x="320" y="212" class="tag">PYTHON · TRY IN ORDER</text>
<!-- Orthogonal connectors, before nodes. Each destination port is distinct. -->
<path d="M256 312H272Q280 312 280 304V280Q280 272 288 272H320" class="edge"/>
<path d="M452 312V352" class="edge optional"/>
<path d="M452 432V472" class="edge optional"/>
<path d="M584 272H624Q632 272 632 280V352Q632 360 640 360H688" class="edge"/>
<path d="M584 392H688" class="edge"/>
<path d="M584 512H648Q656 512 656 504V424Q656 416 664 416H688" class="edge"/>
<path d="M904 384H936Q944 384 944 376V320Q944 312 952 312H984" class="edge"/>
<path d="M584 536H632Q640 536 640 544V588Q640 596 648 596H952Q960 596 960 588V544Q960 536 968 536H984" class="edge optional"/>
<!-- Connector labels, offset from strokes. -->
<rect x="468" y="320" width="100" height="24" fill="#eeeeeb"/><text x="476" y="337" class="sub">NO TEXT</text>
<rect x="468" y="440" width="100" height="24" fill="#eeeeeb"/><text x="476" y="457" class="sub">NO TEXT</text>
<rect x="676" y="568" width="140" height="20" fill="#f7f7f5"/><text x="684" y="583" class="sub">STILL NO TEXT</text>
<!-- Input -->
<rect x="64" y="256" width="192" height="112" rx="6" class="node"/>
<text x="84" y="288" class="tag">01 · INPUT</text><text x="84" y="320" class="name">Validate video URL</text><text x="84" y="346" class="sub">YouTube / Bilibili</text>
<!-- Extraction chain -->
<rect x="320" y="232" width="264" height="80" rx="6" class="node"/>
<text x="340" y="264" class="name">Public captions</text><text x="340" y="288" class="sub">Direct platform requests</text>
<rect x="320" y="352" width="264" height="80" rx="6" class="node"/>
<text x="340" y="384" class="name">Alternate extraction</text><text x="340" y="408" class="sub">yt-dlp package / uvx</text>
<rect x="320" y="472" width="264" height="80" rx="6" class="node"/>
<text x="340" y="504" class="name">Local transcription</text><text x="340" y="528" class="sub">FFmpeg + mlx-whisper</text>
<!-- Text artifact -->
<rect x="688" y="328" width="216" height="112" rx="6" class="focal"/>
<text x="708" y="360" class="tag">02 · TEXT ARTIFACT</text><text x="708" y="392" class="name">Normalize segments</text><text x="708" y="420" class="sub">start · end · text</text>
<!-- AI output and failure -->
<rect x="984" y="256" width="232" height="112" rx="6" class="focal"/>
<text x="1004" y="288" class="tag">03 · AI AGENT</text><text x="1004" y="320" class="name">Evidence-backed digest</text><text x="1004" y="346" class="sub">Claims · quotes · times</text>
<rect x="984" y="496" width="232" height="80" rx="6" fill="#fff" stroke="#62656b" stroke-dasharray="5 4"/>
<text x="1004" y="528" class="name">Actionable failure</text><text x="1004" y="552" class="sub">Ask for a transcript</text>
<!-- Context note and bottom legend -->
<text x="64" y="424" class="sub">X discovery is separate.</text><text x="64" y="448" class="sub">No direct script support.</text>
<path d="M64 644H1216" stroke="#d7d7d3"/>
<path d="M64 676H96" stroke="#62656b" stroke-width="1.4"/><text x="108" y="681" class="sub">TEXT AVAILABLE</text>
<path d="M328 676H360" stroke="#62656b" stroke-width="1.4" stroke-dasharray="5 4"/><text x="372" y="681" class="sub">FALLBACK / FAILURE</text>
<text x="1216" y="681" text-anchor="end" class="sub">Local ASR requires Apple Silicon + MLX</text>
</svg>
